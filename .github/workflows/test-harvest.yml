name: harvester (test mode)
permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

env:
  PG_SERVER: localhost
  PG_PORT: "54322"
  PG_USER: postgres
  PG_PASS: postgres
  PG_DB: postgres
  SUPABASE_URL: http://localhost:54321
  SUPABASE_BUCKET_NAME: data_assets
  OUTPUT: "True"
  MAPBOXUSERNAME: "123"
  MAPBOXTOKEN: "456"
  MAPBOXTILESET: "xyz"
  MAPBOXLAYERNAME: "abc"
  LOGGING: INFO
  SKIP_MAPBOX: "True"
  WEATHER_HARVEST_LAT: "47.9990"
  WEATHER_HARVEST_LNG: "7.8421"
  SURROUNDING_SHAPE_FILE: "/app/assets/freiburg.shp"

jobs:
  test-harvest:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    steps:
      - name: Get the source
        uses: actions/checkout@v4
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Get the source for the api staging
        uses: actions/checkout@v4
        if: github.event.pull_request.base.ref == 'staging' || github.ref == 'refs/heads/staging'
        with:
          repository: technologiestiftung/freiburg-giesst-postgres-api
          path: api
          ref: staging
      - name: Get the source for the api main
        uses: actions/checkout@v4
        if: github.event.pull_request.base.ref == 'main' || github.ref == 'refs/heads/main'
        with:
          repository: technologiestiftung/freiburg-giesst-postgres-api
          path: api
      - uses: supabase/setup-cli@v1
        with:
          version: 2.20.12
      - name: build the harvester
        run: |
          cd harvester && docker build \
            --build-arg SURROUNDING_SHAPE_FILE='${{ env.SURROUNDING_SHAPE_FILE }}' \
            --tag technologiestiftung/freiburg-giesst-dwd-harvester:test .
      - name: Start the api
        id: api-start
        run: cd api && supabase start | grep -w "service_role key" | cut -d ":" -f 2 | xargs |  tr -d '\n' | awk '{print "service_role_key="$1}' >> "$GITHUB_OUTPUT" && cd ..
      - name: run the harvester
        run: docker run --env PG_SERVER='0.0.0.0' --env WEATHER_HARVEST_LAT --env WEATHER_HARVEST_LNG --env SKIP_MAPBOX --env PG_DB --env PG_PORT --env PG_USER --env PG_PASS --env SUPABASE_URL --env SUPABASE_SERVICE_ROLE_KEY='${{ steps.api-start.outputs.service_role_key }}' --env LIMIT_DAYS='30' --env SUPABASE_BUCKET_NAME --env MAPBOXTOKEN --env MAPBOXUSERNAME --env MAPBOXTILESET --env MAPBOXLAYERNAME --env LOGGING --env OUTPUT --env SURROUNDING_SHAPE_FILE='${{ env.SURROUNDING_SHAPE_FILE }}' --network host technologiestiftung/freiburg-giesst-dwd-harvester:test
      - name: stop the api
        run: cd api && supabase stop && cd ..
  release:
    name: semantic-release
    needs: [test-harvest]
    runs-on: ubuntu-latest
    outputs:
      new-release-published: ${{ steps.semantic-release.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - id: semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
