name: Docker Image Builder

env:
  HARVESTER_FOLDER: harvester/
  SURROUNDING_SHAPE_FILE: "/app/assets/freiburg.shp"
  IMAGE: ghcr.io/${{ github.repository }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the source
        uses: actions/checkout@v4
      - name: Login to GHCR, build and push
        env:
          TAG: ${{ github.event.release.tag_name || github.sha }}
          LATEST: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "$HARVESTER_FOLDER"
          docker build \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label version="$TAG" \
            --build-arg SURROUNDING_SHAPE_FILE="$SURROUNDING_SHAPE_FILE" \
            --tag "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          if [ "$LATEST" = "true" ]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
